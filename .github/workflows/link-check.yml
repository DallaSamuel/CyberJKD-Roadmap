# Place at: .github/workflows/link-check.yml  (in each repo you want checked)
# Catches broken INTERNAL + GitHub links on every push and weekly.
# Social / video / Google-Docs links and mailto are excluded on purpose:
# they return 403/999 to CI bots (LinkedIn, X, Instagram, Facebook, YouTube,
# Google Docs), which would fail the run even though they work for real users.
name: Link Check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch:       # run manually from the Actions tab

jobs:
  linkCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --accept 200,206,301,302,429
            --max-concurrency 4
            --exclude-mail
            --exclude 'linkedin\.com'
            --exclude 'x\.com'
            --exclude 'twitter\.com'
            --exclude 'facebook\.com'
            --exclude 'instagram\.com'
            --exclude 'youtube\.com'
            --exclude 'youtu\.be'
            --exclude 'docs\.google\.com'
            --exclude 'calendly\.com'
            './**/*.html' './**/*.md'
          fail: true
