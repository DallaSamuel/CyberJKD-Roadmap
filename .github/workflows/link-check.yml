# Place at: .github/workflows/link-check.yml
# Checks internal + GitHub links on every push and weekly.
# Exclusions live in .lycheeignore at the repo root (auto-read by lychee).
name: Link Check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  linkCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4
            --accept 200,206,301,302,429
            './**/*.html' './**/*.md'
          fail: true
